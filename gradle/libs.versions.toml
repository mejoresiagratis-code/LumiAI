[versions]
agp                     = "8.4.0"
kotlin                  = "1.9.24"
ksp                     = "1.9.24-1.0.20"
coreKtx                 = "1.13.1"
lifecycle               = "2.8.2"
activityCompose         = "1.9.0"
composeBom              = "2024.06.00"
navigationCompose       = "2.7.7"
hilt                    = "2.51.1"
hiltNavigationCompose   = "1.2.0"
room                    = "2.6.1"
datastore               = "1.1.1"
camerax                 = "1.3.3"
admob                   = "23.2.0"
ump                     = "3.0.0"
playBilling             = "7.0.0"
mlkitLightSensor        = "17.0.0"  # ML Kit Image Labeling - used for ambient detection
coroutines              = "1.8.1"
firebaseBom             = "33.1.1"
splashscreen            = "1.0.1"
appcompat               = "1.7.0"
accompanist             = "0.34.0"
junit                   = "4.13.2"
junitExt                = "1.2.1"
espresso                = "3.6.1"

[libraries]
# AndroidX Core
androidx-core-ktx              = { group = "androidx.core",    name = "core-ktx",               version.ref = "coreKtx" }
androidx-lifecycle-runtime     = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-compose     = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose      = { group = "androidx.activity", name = "activity-compose",       version.ref = "activityCompose" }
androidx-splashscreen          = { group = "androidx.core",    name = "core-splashscreen",        version.ref = "splashscreen" }
androidx-appcompat             = { group = "androidx.appcompat", name = "appcompat",                version.ref = "appcompat" }

# Compose BOM
compose-bom                    = { group = "androidx.compose", name = "compose-bom",             version.ref = "composeBom" }
compose-ui                     = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics            = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-material               = { group = "androidx.compose.material", name = "material" }
compose-ui-tooling             = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-animation              = { group = "androidx.compose.animation", name = "animation" }

# Navigation
navigation-compose             = { group = "androidx.navigation", name = "navigation-compose",   version.ref = "navigationCompose" }

# Hilt DI
hilt-android                   = { group = "com.google.dagger", name = "hilt-android",           version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger", name = "hilt-compiler",          version.ref = "hilt" }
hilt-navigation-compose        = { group = "androidx.hilt",     name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Room
room-runtime                   = { group = "androidx.room",    name = "room-runtime",            version.ref = "room" }
room-ktx                       = { group = "androidx.room",    name = "room-ktx",                version.ref = "room" }
room-compiler                  = { group = "androidx.room",    name = "room-compiler",           version.ref = "room" }

# DataStore
datastore-preferences          = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# CameraX
camerax-core                   = { group = "androidx.camera", name = "camera-core",              version.ref = "camerax" }
camerax-camera2                = { group = "androidx.camera", name = "camera-camera2",           version.ref = "camerax" }
camerax-lifecycle              = { group = "androidx.camera", name = "camera-lifecycle",         version.ref = "camerax" }

# Ads & Billing
admob                          = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "admob" }
ump                            = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }
play-billing                   = { group = "com.android.billingclient", name = "billing-ktx",    version.ref = "playBilling" }

# ML Kit
mlkit-image-labeling           = { group = "com.google.mlkit", name = "image-labeling",         version.ref = "mlkitLightSensor" }

# Coroutines
coroutines-android             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Firebase
firebase-bom                   = { group = "com.google.firebase", name = "firebase-bom",        version.ref = "firebaseBom" }
firebase-analytics             = { group = "com.google.firebase", name = "firebase-analytics-ktx" }
firebase-crashlytics           = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }

# Test
junit                          = { group = "junit",            name = "junit",                   version.ref = "junit" }
junit-ext                      = { group = "androidx.test.ext", name = "junit",                  version.ref = "junitExt" }
espresso                       = { group = "androidx.test.espresso", name = "espresso-core",     version.ref = "espresso" }

[plugins]
android-application            = { id = "com.android.application",                  version.ref = "agp" }
kotlin-android                 = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-kapt                    = { id = "org.jetbrains.kotlin.kapt",                 version.ref = "kotlin" }
hilt                           = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
google-services                = { id = "com.google.gms.google-services",            version = "4.4.2" }
firebase-crashlytics           = { id = "com.google.firebase.crashlytics",           version = "3.0.1" }
